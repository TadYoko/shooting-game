<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCEAN DEFENDER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #001a33 0%, #003366 100%);
            overflow: hidden;
        }
        #container {
            position: relative;
        }
        #game {
            background: #001428;
            border: 2px solid #0af;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.3),
                        inset 0 0 50px rgba(0, 100, 200, 0.1);
            border-radius: 4px;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            pointer-events: none;
        }
        .score {
            color: #0af;
            font-size: 24px;
            text-shadow: 0 0 10px #0af, 0 0 20px #0af;
            letter-spacing: 2px;
        }
        .lives {
            display: flex;
            gap: 8px;
        }
        .life {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #0af;
            filter: drop-shadow(0 0 5px #0af);
        }
        .life.lost { opacity: 0.2; }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 20, 40, 0.95);
            font-family: 'Courier New', monospace;
        }
        h1 {
            font-size: 48px;
            background: linear-gradient(180deg, #0af, #f80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0, 170, 255, 0.8));
            margin-bottom: 10px;
            letter-spacing: 6px;
        }
        .subtitle {
            color: #668;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }
        .btn {
            padding: 15px 60px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            background: transparent;
            border: 2px solid #0af;
            color: #0af;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.3s;
            text-shadow: 0 0 10px #0af;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
        }
        .btn:hover {
            background: #0af;
            color: #001428;
            box-shadow: 0 0 40px rgba(0, 170, 255, 0.8);
        }
        .controls {
            margin-top: 40px;
            color: #446;
            font-size: 12px;
            text-align: center;
            line-height: 2;
        }
        .final-score {
            color: #f80;
            font-size: 32px;
            margin: 20px 0;
            text-shadow: 0 0 20px #f80;
        }
        .back-link {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0af;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 5px 10px;
            border: 1px solid #0af;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .back-link:hover {
            background: #0af;
            color: #001428;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← MENU</a>
    <div id="container">
        <canvas id="game" width="500" height="700"></canvas>
        <div id="ui">
            <div class="score">SCORE: <span id="score">0</span></div>
            <div class="lives" id="lives"></div>
        </div>
        <div id="startScreen">
            <h1>OCEAN DEFENDER</h1>
            <p class="subtitle">VS TAKO & IKA</p>
            <button class="btn" onclick="startGame()">START</button>
            <div class="controls">
                [← →] or [A D] MOVE<br>
                [SPACE] or [Z] SHOOT<br>
                [X] BOMB
            </div>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>GAME OVER</h1>
            <div class="final-score">SCORE: <span id="finalScore">0</span></div>
            <button class="btn" onclick="startGame()">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // Audio Context
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        // Sound Effects
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            switch(type) {
                case 'shoot':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'explosion':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'hit':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'bomb':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'powerup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.1);
                    osc.frequency.setValueAtTime(1320, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'gameover':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
                    osc.start(now);
                    osc.stop(now + 1);
                    break;
            }
        }

        // Game State
        let gameRunning = false;
        let score = 0;
        let gameTime = 0;
        let difficulty = 1;

        const player = { x: 250, y: 620, width: 40, height: 30, speed: 7, lives: 3, invincible: 0, bombs: 3 };
        let bullets = [], enemies = [], particles = [], bubbles = [], powerups = [];

        const keys = {};
        let shootCooldown = 0;
        let bombReady = true;

        // Initialize bubbles (instead of stars)
        function initBubbles() {
            bubbles = [];
            for (let i = 0; i < 60; i++) {
                bubbles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 1.5 + 0.3,
                    size: Math.random() * 4 + 2,
                    wobble: Math.random() * Math.PI * 2
                });
            }
        }

        // Particles
        function createParticles(x, y, color, count, speed = 5) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const vel = Math.random() * speed + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * vel,
                    vy: Math.sin(angle) * vel,
                    life: 40 + Math.random() * 20,
                    maxLife: 60,
                    color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Draw Player (submarine)
        function drawPlayer() {
            if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;

            ctx.save();
            ctx.translate(player.x, player.y);

            // Propeller bubbles
            ctx.fillStyle = 'rgba(150, 220, 255, 0.5)';
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(-5 + Math.random() * 10, 25 + Math.random() * 15, 3 + Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Main body
            ctx.fillStyle = '#ffa500';
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ffa500';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Cockpit
            ctx.fillStyle = '#80dfff';
            ctx.shadowColor = '#80dfff';
            ctx.beginPath();
            ctx.ellipse(5, -2, 8, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Periscope
            ctx.fillStyle = '#cc8800';
            ctx.fillRect(-2, -25, 4, 12);
            ctx.beginPath();
            ctx.arc(0, -25, 4, 0, Math.PI * 2);
            ctx.fill();

            // Propeller
            ctx.fillStyle = '#888';
            ctx.fillRect(-5, 12, 10, 6);

            ctx.restore();
        }

        // Draw Bullet (torpedo)
        function drawBullet(b) {
            ctx.save();
            ctx.translate(b.x, b.y);

            if (b.enemy) {
                // Ink blob
                ctx.fillStyle = b.color || '#808';
                ctx.shadowColor = b.color || '#808';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Torpedo
                ctx.fillStyle = '#ff6600';
                ctx.shadowColor = '#ff6600';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.ellipse(0, 0, 4, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                // Trail
                ctx.fillStyle = 'rgba(255, 150, 50, 0.5)';
                ctx.beginPath();
                ctx.ellipse(0, 12, 3, 8, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Draw Enemy - Squid (small), Octopus (medium), Giant Octopus (large)
        function drawEnemy(e) {
            ctx.save();
            ctx.translate(e.x, e.y);

            const wobble = Math.sin(gameTime * 0.1 + e.offset) * 0.1;

            if (e.type === 'small') {
                // SQUID (イカ)
                ctx.fillStyle = '#ff6688';
                ctx.strokeStyle = '#ff8899';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ff6688';
                ctx.shadowBlur = 10;

                // Body (elongated)
                ctx.beginPath();
                ctx.moveTo(0, -20);
                ctx.quadraticCurveTo(12, -10, 10, 5);
                ctx.quadraticCurveTo(0, 10, -10, 5);
                ctx.quadraticCurveTo(-12, -10, 0, -20);
                ctx.fill();
                ctx.stroke();

                // Fins
                ctx.beginPath();
                ctx.moveTo(10, -15);
                ctx.quadraticCurveTo(20, -10, 15, 0);
                ctx.lineTo(10, -5);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-10, -15);
                ctx.quadraticCurveTo(-20, -10, -15, 0);
                ctx.lineTo(-10, -5);
                ctx.fill();

                // Tentacles (10 short ones)
                ctx.strokeStyle = '#ff6688';
                ctx.lineWidth = 2;
                for (let i = 0; i < 10; i++) {
                    const tx = -9 + i * 2;
                    const len = 8 + Math.sin(gameTime * 0.2 + i) * 3;
                    ctx.beginPath();
                    ctx.moveTo(tx, 5);
                    ctx.quadraticCurveTo(tx + Math.sin(gameTime * 0.15 + i) * 3, 10, tx, 5 + len);
                    ctx.stroke();
                }

                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-4, -8, 4, 5, 0, 0, Math.PI * 2);
                ctx.ellipse(4, -8, 4, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-4, -7, 2, 0, Math.PI * 2);
                ctx.arc(4, -7, 2, 0, Math.PI * 2);
                ctx.fill();

            } else if (e.type === 'medium') {
                // OCTOPUS (タコ)
                ctx.fillStyle = '#cc44aa';
                ctx.strokeStyle = '#dd66bb';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#cc44aa';
                ctx.shadowBlur = 15;

                // Head (round)
                ctx.beginPath();
                ctx.arc(0, -8, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 8 Tentacles
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI - Math.PI / 2 + Math.PI / 8;
                    const baseX = Math.cos(angle) * 15;
                    const baseY = 5 + Math.abs(Math.cos(angle)) * 5;
                    const wave = Math.sin(gameTime * 0.1 + i * 0.8) * 8;
                    const endX = baseX + wave;
                    const endY = baseY + 25 + Math.sin(gameTime * 0.15 + i) * 5;

                    ctx.beginPath();
                    ctx.moveTo(baseX, baseY);
                    ctx.quadraticCurveTo(baseX + wave * 0.5, baseY + 15, endX, endY);
                    ctx.stroke();

                    // Suckers
                    ctx.fillStyle = '#ffaacc';
                    for (let j = 1; j <= 3; j++) {
                        const t = j / 4;
                        const sx = baseX + (endX - baseX) * t;
                        const sy = baseY + (endY - baseY) * t;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#cc44aa';
                }

                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-7, -10, 6, 7, 0, 0, Math.PI * 2);
                ctx.ellipse(7, -10, 6, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-7, -9, 3, 0, Math.PI * 2);
                ctx.arc(7, -9, 3, 0, Math.PI * 2);
                ctx.fill();

            } else if (e.type === 'large') {
                // GIANT OCTOPUS (大ダコ)
                const pulse = Math.sin(gameTime * 0.08) * 0.15 + 0.85;
                ctx.fillStyle = `rgba(180, 50, 120, ${pulse})`;
                ctx.strokeStyle = '#cc3388';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#aa2266';
                ctx.shadowBlur = 25;

                // Giant head
                ctx.beginPath();
                ctx.arc(0, -15, 30, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Spots on head
                ctx.fillStyle = 'rgba(255, 100, 150, 0.5)';
                ctx.beginPath();
                ctx.arc(-15, -25, 6, 0, Math.PI * 2);
                ctx.arc(10, -30, 5, 0, Math.PI * 2);
                ctx.arc(18, -18, 4, 0, Math.PI * 2);
                ctx.fill();

                // 8 Giant Tentacles
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.strokeStyle = `rgba(180, 50, 120, ${pulse})`;
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI - Math.PI / 2 + Math.PI / 8;
                    const baseX = Math.cos(angle) * 25;
                    const baseY = 10 + Math.abs(Math.cos(angle)) * 8;
                    const wave1 = Math.sin(gameTime * 0.08 + i * 0.7) * 15;
                    const wave2 = Math.cos(gameTime * 0.1 + i * 0.5) * 10;
                    const endX = baseX + wave1;
                    const endY = baseY + 45 + Math.sin(gameTime * 0.12 + i) * 8;

                    ctx.beginPath();
                    ctx.moveTo(baseX, baseY);
                    ctx.bezierCurveTo(
                        baseX + wave1 * 0.3, baseY + 15,
                        baseX + wave2, baseY + 30,
                        endX, endY
                    );
                    ctx.stroke();

                    // Big suckers
                    ctx.fillStyle = '#ffbbdd';
                    for (let j = 1; j <= 4; j++) {
                        const t = j / 5;
                        const sx = baseX + (endX - baseX) * t + Math.sin(t * 3 + gameTime * 0.1) * 3;
                        const sy = baseY + (endY - baseY) * t;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Angry eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(-12, -18, 10, 12, -0.2, 0, Math.PI * 2);
                ctx.ellipse(12, -18, 10, 12, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff0000';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(-12, -16, 5, 0, Math.PI * 2);
                ctx.arc(12, -16, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-12, -16, 2, 0, Math.PI * 2);
                ctx.arc(12, -16, 2, 0, Math.PI * 2);
                ctx.fill();

                // Eyebrows (angry)
                ctx.strokeStyle = '#660033';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-22, -28);
                ctx.lineTo(-5, -25);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(22, -28);
                ctx.lineTo(5, -25);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Draw Powerup (treasure chest)
        function drawPowerup(p) {
            ctx.save();
            ctx.translate(p.x, p.y);

            const pulse = Math.sin(gameTime * 0.2) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 215, 0, ${pulse})`;
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;

            // Chest
            ctx.fillRect(-10, -5, 20, 12);
            ctx.strokeRect(-10, -5, 20, 12);

            // Lid
            ctx.beginPath();
            ctx.moveTo(-10, -5);
            ctx.quadraticCurveTo(0, -15, 10, -5);
            ctx.fill();
            ctx.stroke();

            // Sparkle
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-3, -8, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Update functions
        function updateBubbles() {
            bubbles.forEach(b => {
                b.y -= b.speed;
                b.x += Math.sin(gameTime * 0.05 + b.wobble) * 0.5;
                if (b.y < -10) {
                    b.y = canvas.height + 10;
                    b.x = Math.random() * canvas.width;
                }
            });
        }

        function updatePlayer() {
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            player.x = Math.max(25, Math.min(canvas.width - 25, player.x));
            if (player.invincible > 0) player.invincible--;
        }

        function updateBullets() {
            bullets = bullets.filter(b => {
                if (b.enemy) {
                    b.x += b.vx || 0;
                    b.y += b.vy || 0;
                    return b.y < canvas.height + 20 && b.y > -20;
                } else {
                    b.y -= b.speed;
                    return b.y > -20;
                }
            });
        }

        function updateEnemies() {
            enemies.forEach(e => {
                e.y += e.speed;
                if (e.type === 'small') {
                    e.x += Math.sin(gameTime * 0.05 + e.offset) * 2;
                } else if (e.type === 'medium') {
                    e.shootTimer--;
                    if (e.shootTimer <= 0) {
                        const angle = Math.atan2(player.y - e.y, player.x - e.x);
                        bullets.push({
                            x: e.x, y: e.y + 20,
                            speed: 5,
                            vx: Math.cos(angle) * 5,
                            vy: Math.sin(angle) * 5,
                            enemy: true,
                            color: '#a040a0'
                        });
                        e.shootTimer = 100;
                        playSound('shoot');
                    }
                } else if (e.type === 'large') {
                    e.x += Math.sin(gameTime * 0.03) * 1.5;
                    e.shootTimer--;
                    if (e.shootTimer <= 0) {
                        // Spread ink
                        for (let i = -2; i <= 2; i++) {
                            const angle = Math.PI / 2 + i * 0.3;
                            bullets.push({
                                x: e.x, y: e.y + 30,
                                vx: Math.cos(angle) * 4,
                                vy: Math.sin(angle) * 4,
                                enemy: true,
                                color: '#602060'
                            });
                        }
                        e.shootTimer = 80;
                    }
                }
            });
            enemies = enemies.filter(e => e.y < canvas.height + 50 && e.hp > 0);
        }

        function updatePowerups() {
            powerups.forEach(p => p.y += 2);
            powerups = powerups.filter(p => p.y < canvas.height + 20);
        }

        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96;
                p.vy *= 0.96;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function checkCollisions() {
            bullets.filter(b => !b.enemy).forEach((b, bi) => {
                enemies.forEach(e => {
                    const hitbox = e.type === 'large' ? 40 : (e.type === 'medium' ? 25 : 15);
                    if (Math.abs(b.x - e.x) < hitbox && Math.abs(b.y - e.y) < hitbox) {
                        e.hp--;
                        b.y = -100;
                        createParticles(b.x, b.y, '#80dfff', 5, 3);
                        playSound('hit');

                        if (e.hp <= 0) {
                            const points = e.type === 'large' ? 500 : (e.type === 'medium' ? 200 : 100);
                            score += points;
                            createParticles(e.x, e.y, e.type === 'large' ? '#cc3388' : '#cc44aa', 25, 6);
                            playSound('explosion');

                            if (Math.random() < 0.15) {
                                powerups.push({ x: e.x, y: e.y });
                            }
                        }
                    }
                });
            });

            if (player.invincible === 0) {
                bullets.filter(b => b.enemy).forEach(b => {
                    if (Math.abs(b.x - player.x) < 15 && Math.abs(b.y - player.y) < 15) {
                        playerHit();
                        b.y = 1000;
                    }
                });

                enemies.forEach(e => {
                    const hitbox = e.type === 'large' ? 35 : 20;
                    if (Math.abs(e.x - player.x) < hitbox && Math.abs(e.y - player.y) < hitbox) {
                        playerHit();
                    }
                });
            }

            powerups.forEach((p, i) => {
                if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - player.y) < 25) {
                    powerups.splice(i, 1);
                    player.bombs = Math.min(player.bombs + 1, 5);
                    playSound('powerup');
                    createParticles(p.x, p.y, '#ffd700', 15);
                }
            });
        }

        function playerHit() {
            player.lives--;
            player.invincible = 120;
            createParticles(player.x, player.y, '#ffa500', 30);
            playSound('explosion');
            updateLivesUI();

            if (player.lives <= 0) {
                gameOver();
            }
        }

        function useBomb() {
            if (player.bombs <= 0 || !bombReady) return;
            player.bombs--;
            bombReady = false;
            setTimeout(() => bombReady = true, 1000);

            playSound('bomb');

            enemies.forEach(e => {
                score += 50;
                createParticles(e.x, e.y, '#ff6688', 20);
            });
            enemies = [];
            bullets = bullets.filter(b => !b.enemy);
            createParticles(canvas.width / 2, canvas.height / 2, '#80dfff', 50, 15);
        }

        function spawnEnemy() {
            const rand = Math.random();
            let type, hp, speed;

            if (rand < 0.6) {
                type = 'small'; hp = 1; speed = 3 + difficulty * 0.3;
            } else if (rand < 0.9) {
                type = 'medium'; hp = 3; speed = 2 + difficulty * 0.2;
            } else {
                type = 'large'; hp = 10; speed = 1 + difficulty * 0.1;
            }

            enemies.push({
                type, hp, speed,
                x: Math.random() * (canvas.width - 80) + 40,
                y: -40,
                offset: Math.random() * 100,
                shootTimer: 60
            });
        }

        // Drawing
        function drawBubbles() {
            bubbles.forEach(b => {
                ctx.strokeStyle = `rgba(100, 180, 255, 0.3)`;
                ctx.fillStyle = `rgba(150, 200, 255, 0.1)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(b.x - b.size * 0.3, b.y - b.size * 0.3, b.size * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawBombs() {
            ctx.fillStyle = '#ffd700';
            ctx.font = '16px Courier New';
            ctx.textAlign = 'left';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            ctx.fillText('BOMB: ' + '💣'.repeat(player.bombs), 15, canvas.height - 15);
            ctx.shadowBlur = 0;
        }

        function updateLivesUI() {
            const container = document.getElementById('lives');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const life = document.createElement('div');
                life.className = 'life' + (i >= player.lives ? ' lost' : '');
                container.appendChild(life);
            }
        }

        function handleInput() {
            if (shootCooldown > 0) shootCooldown--;

            if ((keys['Space'] || keys['KeyZ']) && shootCooldown === 0) {
                bullets.push({ x: player.x - 8, y: player.y - 20, speed: 12 });
                bullets.push({ x: player.x + 8, y: player.y - 20, speed: 12 });
                shootCooldown = 10;
                playSound('shoot');
            }

            if (keys['KeyX']) {
                useBomb();
            }
        }

        // Game Loop
        function gameLoop() {
            if (!gameRunning) return;

            // Ocean background
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#001830');
            bgGrad.addColorStop(0.5, '#002850');
            bgGrad.addColorStop(1, '#003870');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            updateBubbles();
            drawBubbles();

            updatePlayer();
            handleInput();
            updateBullets();
            updateEnemies();
            updatePowerups();
            updateParticles();
            checkCollisions();

            enemies.forEach(drawEnemy);
            bullets.forEach(drawBullet);
            powerups.forEach(drawPowerup);
            drawParticles();
            drawPlayer();
            drawBombs();

            document.getElementById('score').textContent = score;

            gameTime++;
            if (gameTime % Math.max(30, 60 - difficulty * 5) === 0) spawnEnemy();
            if (gameTime % 600 === 0) difficulty = Math.min(difficulty + 0.5, 10);

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            initAudio();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');

            player.x = 250;
            player.y = 620;
            player.lives = 3;
            player.invincible = 0;
            player.bombs = 3;

            bullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            score = 0;
            gameTime = 0;
            difficulty = 1;
            shootCooldown = 0;
            bombReady = true;

            initBubbles();
            updateLivesUI();
            gameRunning = true;
            gameLoop();
        }

        function gameOver() {
            gameRunning = false;
            playSound('gameover');
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        // Events
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);

        initBubbles();
        updateLivesUI();
    </script>
</body>
</html>
