<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooting Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a1a2a 100%);
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        h1 {
            font-size: 48px;
            background: linear-gradient(180deg, #0ff, #f0f, #ff0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.5));
            margin-bottom: 50px;
            letter-spacing: 6px;
            text-align: center;
        }
        .games {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-card {
            width: 280px;
            background: linear-gradient(145deg, #1a1a2e, #2a2a4e);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 2px solid #333;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
        }
        .game-card:hover {
            transform: translateY(-10px);
            border-color: #0ff;
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.2),
                        0 0 30px rgba(0, 255, 255, 0.1);
        }
        .game-card.cyber:hover {
            border-color: #f0f;
            box-shadow: 0 20px 40px rgba(255, 0, 255, 0.2),
                        0 0 30px rgba(255, 0, 255, 0.1);
        }
        .game-card.ocean:hover {
            border-color: #0af;
            box-shadow: 0 20px 40px rgba(0, 170, 255, 0.2),
                        0 0 30px rgba(0, 170, 255, 0.1);
        }
        .game-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }
        .game-title {
            font-size: 22px;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        .cyber .game-title {
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
        }
        .ocean .game-title {
            color: #0af;
            text-shadow: 0 0 10px #0af;
        }
        .game-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            padding: 5px 15px;
            background: #333;
            border-radius: 20px;
            font-size: 10px;
            color: #0ff;
            margin-top: 15px;
            letter-spacing: 2px;
        }
        .cyber .badge {
            color: #f0f;
            border: 1px solid #f0f;
        }
        .ocean .badge {
            color: #0af;
            border: 1px solid #0af;
        }
        footer {
            margin-top: 60px;
            color: #444;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>SHOOTING GAMES</h1>

    <div class="games">
        <a href="cyber.html" class="game-card cyber">
            <span class="game-icon">🚀</span>
            <div class="game-title">CYBER BLASTER</div>
            <p class="game-desc">
                サイバーパンク風シューティング<br>
                宇宙を舞台にエイリアンと戦え！
            </p>
            <span class="badge">SPACE SHOOTER</span>
        </a>

        <a href="ocean.html" class="game-card ocean">
            <span class="game-icon">🐙</span>
            <div class="game-title">OCEAN DEFENDER</div>
            <p class="game-desc">
                海底を舞台にしたシューティング<br>
                タコとイカの大群を撃退せよ！
            </p>
            <span class="badge">VS TAKO & IKA</span>
        </a>
    </div>

    <footer>
        🎮 Use Arrow Keys to Move, Space to Shoot, X for Bomb
    </footer>
</body>
</html>
